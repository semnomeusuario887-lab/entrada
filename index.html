<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENTRADA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            border: 2px solid #0f0;
            padding: 40px 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 20px #0f0;
        }

        .title {
            color: #0f0;
            font-size: 3rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #0f0;
            letter-spacing: 2px;
        }

        .error {
            color: #ff0;
            font-size: 1.2rem;
            margin: 30px 0;
            padding: 15px;
            border: 1px solid #ff0;
            background: rgba(255, 255, 0, 0.1);
        }

        .footer {
            color: #888;
            margin-top: 40px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">ENTRADA</h1>
        
        <div class="error">
            Gamelistanceld not found in the URL!
        </div>
        
        <div class="footer">
            Created by Dark Dev
        </div>
    </div>
</body>
</html>
